name: Deploy Project

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # :latest is what the stack runs; the commit tag is kept for rollbacks
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same as "Update the stack" with "Re-pull image and redeploy" in Portainer, through its API
      # (works on Community Edition; stack webhooks need Business Edition).
      # Secrets: PORTAINER_URL (e.g. https://portainer.example.com, no trailing slash),
      # PORTAINER_API_KEY (My account > Access tokens), PORTAINER_STACK_ID (the number in the
      # stack's URL in Portainer).
      - name: Redeploy Portainer stack
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          set -euo pipefail
          api() { curl -fsS --retry 3 -H "X-API-Key: $PORTAINER_API_KEY" "$@"; }

          stack=$(api "$PORTAINER_URL/api/stacks/$STACK_ID")
          endpoint_id=$(jq -r '.EndpointId' <<<"$stack")
          stack_env=$(jq -c '.Env // []' <<<"$stack")
          compose=$(api "$PORTAINER_URL/api/stacks/$STACK_ID/file" | jq -r '.StackFileContent')

          # resend the stack's current compose file and env unchanged, asking for a fresh pull
          jq -n --arg file "$compose" --argjson env "$stack_env" \
            '{stackFileContent: $file, env: $env, prune: false, pullImage: true}' \
          | api -X PUT -H "Content-Type: application/json" --data @- \
              "$PORTAINER_URL/api/stacks/$STACK_ID?endpointId=$endpoint_id" > /dev/null

          echo "Stack $STACK_ID redeployed with a fresh pull of :latest"